<header class="navbar">
  <div class="nav-container">
    <a routerLink="/" (click)="closeMobileMenu()" class="gold-shimmer-logo">Forever Treasures</a>
    
    <!-- Animated Hamburger Toggle -->
    <button 
      class="hamburger-btn" 
      [class.open]="isMobileMenuOpen()" 
      (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Nav Links with Touch Swipe Listeners -->
    <nav 
      class="nav-links" 
      [class.mobile-open]="isMobileMenuOpen()"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)">

      <!-- Optional Swipe Handle Visual Indicator for Mobile -->
      <div class="mobile-swipe-handle"></div>

      <a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/about-us" (click)="closeMobileMenu()" routerLinkActive="active">About Us</a>
      <a routerLink="/products" (click)="closeMobileMenu()" routerLinkActive="active">Products</a>
      <a routerLink="/contact-us" (click)="closeMobileMenu()" routerLinkActive="active">Contact Us</a>
      
      <!-- Seller Portal Link -->
      <a *ngIf="authService.isAdmin()" routerLink="/admin" (click)="closeMobileMenu()" routerLinkActive="active" class="admin-nav-link">
        ⚡ Portal
      </a>
      
      <button (click)="handleCartClick()" class="cart-link">
        🛒 Cart
        <span *ngIf="totalCount() > 0" class="cart-badge">{{ totalCount() }}</span>
      </button>

      <!-- Dynamic Auth Controls -->
      <ng-container *ngIf="authService.isLoggedIn(); else showLogin">
        <div class="user-session">
          <span class="role-badge" [class.admin]="authService.isAdmin()">
            {{ authService.isAdmin() ? 'Seller' : 'Customer' }}
          </span>
          <button (click)="handleLogout()" class="auth-btn logout-btn">Logout</button>
        </div>
      </ng-container>

      <ng-template #showLogin>
        <a routerLink="/login" (click)="closeMobileMenu()" class="auth-btn login-btn">Sign In</a>
      </ng-template>
    </nav>
  </div>
</header>

<main class="content-container">
  <router-outlet></router-outlet>
</main>
