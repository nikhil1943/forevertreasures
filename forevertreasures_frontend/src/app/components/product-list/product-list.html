<div class="container" style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
  <h2 class="page-title" style="margin-bottom: 1.5rem;">Explore Catalog</h2>

  <!-- Filters & Search Bar -->
  <div class="filter-bar">
    <input 
      type="text" 
      [(ngModel)]="searchQuery" 
      (input)="onSearchChange()" 
      placeholder="Search products..." 
      class="filter-input search-input"
    />

    <!-- Filter by Category Dropdown -->
    <!-- <select 
      class="filter-select"
      [(ngModel)]="selectedCategoryId" 
      (change)="onCategoryChange()">
      <option [ngValue]="null">Filter by Category</option>
      <option *ngFor="let cat of categories" [ngValue]="cat.id">
        {{ cat.name }}
      </option>
    </select> -->

    <!-- Filter by Price Dropdown -->
    <!-- <select 
      class="filter-select"
      [(ngModel)]="selectedPriceRange" 
      (change)="onPriceRangeChange()">
      <option [ngValue]="null">Filter by Price</option>
      <option *ngFor="let range of priceRanges" [ngValue]="range">
        {{ range.label }}
      </option>
    </select>
  </div> -->

  <!-- Skeleton Loading State -->
  <div *ngIf="loading" class="product-grid">
    <div *ngFor="let item of [1, 2, 3, 4, 5, 6, 7, 8]" class="product-card skeleton-card">
      <div class="skeleton-image skeleton-pulse"></div>
      <div class="skeleton-info">
        <div class="skeleton-line title skeleton-pulse"></div>
        <div class="skeleton-line price skeleton-pulse"></div>
        <div class="skeleton-button skeleton-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div *ngIf="!loading && products.length > 0" class="product-grid">
    <div *ngFor="let product of products" class="product-card">
      
      <!-- Card Body -->
      <div class="product-info">
        <span class="category-tag">{{ product.category?.name || 'General' }}</span>
        
        <!-- Clickable Image Container with Sliding Track -->
        <a [routerLink]="['/products', product.id]" 
           class="image-container"
           (mouseenter)="startSlideshow(product)"
           (mouseleave)="stopSlideshow(product)">
        
          <div class="slideshow-track" [style.transform]="'translateX(-' + (activeImageMap[product.id] || 0) * 100 + '%)'">
            
            <!-- Fallback if no images exist -->
            <img *ngIf="!product.image_urls || product.image_urls.length === 0" 
                 [src]="getSafeUrl('https://via.placeholder.com/200x200?text=No+Image')" 
                 alt="No Image" 
                 loading="lazy"
                 decoding="async"
                 class="slide-image" />
            
            <!-- Loop through all images -->
            <img *ngFor="let imgUrl of product.image_urls" 
                 [src]="getSafeUrl(imgUrl)" 
                 [alt]="product.title" 
                 loading="lazy"
                 decoding="async"
                 class="slide-image" />

          </div>
        </a>

        <!-- Product Title Link -->
        <h3 class="product-title">
          <a [routerLink]="['/products', product.id]">{{ product.title }}</a>
        </h3>

        <!-- Footer Row with Price and Single Add to Cart Button -->
        <div class="card-footer">
          <span class="product-price">Rs. {{ product.price | number:'1.2-2' }}</span>
          
          <button 
            class="quick-add-btn" 
            [disabled]="product.stock_quantity === 0"
            (click)="quickAddToCart(product, $event)">
            {{ product.stock_quantity > 0 ? 'Add to Cart' : 'Out of Stock' }}
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && products.length === 0" class="no-products" style="text-align: center; padding: 3rem; color: #64748b;">
    No products found matching your criteria.
  </div>

  <!-- Pagination Controls -->
  <div *ngIf="!loading && products.length > 0" class="pagination-controls" style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem;">
    <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="page-btn">
      Previous
    </button>
    <span class="page-indicator">Page {{ currentPage }}</span>
    <button (click)="changePage(currentPage + 1)" [disabled]="products.length < pageSize" class="page-btn">
      Next
    </button>
  </div>

</div>
