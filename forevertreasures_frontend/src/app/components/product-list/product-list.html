<div class="container" style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
  <h2 class="page-title" style="margin-bottom: 1.5rem;">Explore Catalog</h2>

  <!-- Filters & Search Bar -->
  <div class="filter-bar">
    <input 
      type="text" 
      [(ngModel)]="searchQuery" 
      (input)="onSearchChange()" 
      placeholder="Search products..." 
      class="filter-input search-input"
    />
  </div>

  <!-- Initial Loading State (Skeleton) -->
  <div *ngIf="isInitialLoad" class="product-grid">
    <div *ngFor="let item of [1, 2, 3, 4, 5, 6, 7, 8]" class="product-card skeleton-card">
      <div class="skeleton-image skeleton-pulse"></div>
      <div class="skeleton-info">
        <div class="skeleton-line title skeleton-pulse"></div>
        <div class="skeleton-line price skeleton-pulse"></div>
        <div class="skeleton-button skeleton-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div *ngIf="products.length > 0" class="product-grid">
    <div *ngFor="let product of products" class="product-card">
      
      <div class="product-info">
        <span class="category-tag">{{ product.category?.name || 'General' }}</span>
        
        <!-- Inside your product-info div... -->
        <a [routerLink]="['/products', product.id]" 
          class="image-container"
          (mouseenter)="startSlideshow(product)"
          (mouseleave)="stopSlideshow(product)">

          <div class="slideshow-track" [style.transform]="'translateX(-' + (activeImageMap[product.id] || 0) * 100 + '%)'">
            
            <!-- FIX 1: Removed getSafeUrl from the placeholder -->
            <img *ngIf="!product.image_urls || product.image_urls.length === 0" 
                src="https://via.placeholder.com/200x200?text=No+Image" 
                alt="No Image" 
                loading="lazy"
                decoding="async"
                class="slide-image" />
            
            <!-- FIX 2: Removed getSafeUrl from the Supabase URL binding -->
            <img *ngFor="let imgUrl of product.image_urls" 
                [src]="imgUrl" 
                [alt]="product.title" 
                loading="lazy"
                decoding="async"
                class="slide-image" />
          </div>
        </a>

        <h3 class="product-title">
          <a [routerLink]="['/products', product.id]">{{ product.title }}</a>
        </h3>

        <div class="card-footer">
          <span class="product-price">Rs. {{ product.price.toFixed(2) }}</span>
          
          <button 
            class="quick-add-btn" 
            [disabled]="product.stock_quantity === 0"
            (click)="quickAddToCart(product, $event)">
            {{ product.stock_quantity > 0 ? 'Add to Cart' : 'Out of Stock' }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Infinite Scroll Loading Indicators -->
  <div class="scroll-status-container">
    
    <!-- Shows while user scrolls and app is fetching more -->
    <div *ngIf="isLoadingMore" class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading more treasures...</p>
    </div>

    <!-- Shows when the user has scrolled through everything -->
    <div *ngIf="!hasMore && !isInitialLoad && products.length > 0" class="end-of-list">
      <p>You've seen everything! Check back later for new arrivals.</p>
    </div>

    <!-- Empty State if filters yield no results -->
    <div *ngIf="!isInitialLoad && products.length === 0" class="no-results">
      <p>No products found matching your criteria.</p>
    </div>
  </div>
</div>
