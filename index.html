<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Treasures - Coming Soon</title>
    <!-- Google Fonts for luxury typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Hero Section: Logo takes up the full screen height -->
    <header class="hero-section">
        <div class="logo-container">
            <!-- Ensure your logo image is saved as logo.jpg in this same directory -->
            <img src="assets/logo.jpeg" alt="Forever Treasures Logo" class="hero-logo">
        </div>
        <!-- Subtle indicator prompting users to scroll down -->
        <div class="scroll-indicator">
            <span class="arrow">&#x2193;</span>
        </div>
    </header>

    <!-- Main Content Section: Appears below the logo hero -->
    <main class="content-section">
        <div class="wrapper">
            
            <h1 class="main-title">Coming Soon</h1>
            
            <!-- Elegant text separator -->
            <div class="divider">
                <span class="divider-diamond">&#9670;</span>
            </div>

            <p class="announcement-text">
                We are curating something exceptional. An exquisite destination tailored for celebrating life's greatest milestones is currently under preparation.
            </p>

            <!-- Contact Hub -->
            <section class="contact-hub">
                <h2 class="contact-title">Contact Us</h2>
                <div class="contact-list">
                    <div class="contact-item">
                        <span class="label">Email</span>
                        <a href="mailto:Connect@forevertreasures.in" class="value">Connect@forevertreasures.in</a>
                    </div>
                    <div class="contact-item">
                        <span class="label">Phone</span>
                        <a href="tel:+919883206714" class="value">+91 9883206714</a>
                        <a href="tel:+919007135762" class="value">+91 9007135762</a>
                    </div>
                    
                </div>
            </section>

        </div>
    </main>

</body>
</html>
